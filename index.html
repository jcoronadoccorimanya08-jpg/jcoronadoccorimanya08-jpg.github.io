<!doctype html>
<html lang="es-BO">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Apps</title>
    <style>
      :root { --bg: #0b0e13; --text: #e9eef5; --muted: #a3afc0; --accent: #2ee6a8; --line: #252e3a; }
      @media (prefers-color-scheme: light) { :root { --bg: #f3f5f8; --text: #10161f; --muted: #556072; --accent: #0a7d5a; --line: #d8dee8; } }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
      main { padding: 24px 16px; max-width: 420px; width: 100%; box-sizing: border-box; }
      a { display: block; margin-top: 12px; padding: 16px; border: 1px solid var(--line); border-radius: 14px; color: var(--text); text-decoration: none; font-weight: 600; }
      a span { display: block; font-weight: 400; color: var(--muted); font-size: 14px; }
      h1 { margin: 0; font-size: 26px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Apps</h1>
      <a href="./val-quirurgico/">Val Q <span>Hábitos, porcentaje del día y premios.</span></a>
      <a href="./Bitacora/">Bitácora <span>Racha, ahorro y premios.</span></a>
    </main>
  </body>
</html>
